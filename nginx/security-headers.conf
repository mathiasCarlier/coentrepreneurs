# =============================================================
# En-têtes de sécurité HTTP — app.coentrepreneurs.fr
#
# À copier sur le VPS puis inclure dans le bloc `server` HTTPS du
# conteneur app-nginx-1 :
#
#     server {
#         listen 443 ssl;
#         server_name app.coentrepreneurs.fr;
#         include /etc/nginx/snippets/security-headers.conf;
#         ...
#     }
#
# ⚠️ Piège nginx : `add_header` déclaré dans un bloc enfant (location,
# if…) ANNULE tous les add_header hérités du parent. Si un `location`
# de ce vhost déclare déjà un add_header, il faut y ré-inclure ce
# fichier, sinon les en-têtes ci-dessous disparaissent silencieusement.
# Vérifier après reload avec :  curl -I https://app.coentrepreneurs.fr
# =============================================================

# Force HTTPS pendant 1 an. À n'activer qu'une fois le certificat
# Let's Encrypt confirmé fonctionnel : un navigateur ayant vu cet
# en-tête refusera tout accès HTTP au domaine jusqu'à expiration.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Interdit l'encadrement du site dans une iframe tierce (clickjacking).
add_header X-Frame-Options "SAMEORIGIN" always;

# Empêche le navigateur de deviner un type MIME différent de celui
# annoncé (évite qu'un upload soit interprété comme du script).
add_header X-Content-Type-Options "nosniff" always;

# Ne fuite pas l'URL complète (qui peut contenir un token de reset)
# vers les domaines tiers.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Coupe les API navigateur non utilisées par l'app.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# Masque « nginx/1.29.5 » dans les réponses et les pages d'erreur.
server_tokens off;

# -------------------------------------------------------------
# Content-Security-Policy — À ACTIVER EN DEUX TEMPS
#
# Flutter web (CanvasKit) compile du WASM et a besoin de
# 'wasm-unsafe-eval'. Le Service Worker push et les appels REST vers
# /supabase-api doivent aussi être autorisés. Une CSP trop stricte
# rend l'app blanche sans message clair : commencer en Report-Only,
# regarder la console du navigateur pendant quelques jours, puis
# basculer sur l'en-tête définitif.
#
# ÉTAPE 1 — observer sans rien casser (décommenter) :
# add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://app.coentrepreneurs.fr; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
#
# ÉTAPE 2 — une fois la console propre, remplacer par (et supprimer
# la ligne Report-Only ci-dessus) :
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://app.coentrepreneurs.fr; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
# -------------------------------------------------------------
