# =============================================================
# app.coentrepreneurs.fr — vhost sur le serveur YunoHost du bureau
#
# Emplacement sur le serveur :
#     /etc/nginx/conf.d/app.coentrepreneurs.fr.d/coentrepreneurs.conf
#
# YunoHost inclut ce fichier dans le bloc `server` HTTPS du domaine
# (créé par `yunohost domain add app.coentrepreneurs.fr`). TLS, le
# certificat Let's Encrypt et HSTS sont gérés par YunoHost : ne pas
# les redéclarer ici. `yunohost tools regen-conf` n'écrase pas ce
# fichier.
#
# Remplace le conteneur app-nginx-1 de l'ancien VPS Hetzner. À
# confronter avec ~/app/nginx/default.conf de l'ancien VPS avant la
# mise en service, pour ne perdre aucune règle.
#
# Après modification :
#     sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ Le portail SSO de YunoHost (SSOwat) s'applique à toutes les
# requêtes. Vérifier que l'app reste publique :
#     curl -k --resolve app.coentrepreneurs.fr:443:127.0.0.1 https://app.coentrepreneurs.fr/
# doit renvoyer l'index.html Flutter, pas un 302 vers /yunohost/sso.
# =============================================================

# Build Flutter web, déployé par deploy.sh
root /var/www/coentrepreneurs;
index index.html;

# Uploads Storage (images d'événements, pièces jointes des messages)
client_max_body_size 50M;

# En-têtes absents de la conf YunoHost (cf. security-headers.conf).
# more_set_headers remplace au lieu de dupliquer, et s'applique aussi
# aux réponses d'erreur.
more_set_headers "X-Frame-Options: SAMEORIGIN";
more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=(), payment=()";

# API Supabase (Kong, publié sur la boucle locale uniquement).
# Le slash final de proxy_pass retire le préfixe /supabase-api.
location /supabase-api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;

    # Websockets Realtime (streams de l'app)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Liens des emails GoTrue (reset password, confirmation) : ils pointent
# toujours sur /auth/v1/verify, sans le préfixe /supabase-api.
# proxy_pass SANS slash final, pour transmettre le chemin tel quel.
location /auth/v1/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Fichiers cachés (.env, .git…) : jamais servis, même par erreur de
# build. Les chemins /.well-known/ de YunoHost (ACME, diagnostic)
# restent accessibles.
location ~ /\.(?!well-known/) {
    deny all;
}

# Application Flutter : les routes GoRouter (/login, /reset-password…)
# retombent sur index.html (usePathUrlStrategy, URLs sans #).
location / {
    try_files $uri $uri/ /index.html;
}
